# Builds the editor, runs the tests, and publishes dist/pages to the gh-pages branch (GitHub Pages: Deploy from a branch → gh-pages / root).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and test (npm test builds dist/web, dist/figma and dist/pages first)
        run: npm test
      - name: Publish dist/pages to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/pages
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Pages: ${{ github.sha }}"
