<title>도트랩 에디터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Silkscreen&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: framed workspace — tool rail | stage with tool options, status and timeline | inspector (AI on top, layers + palette below) */
:root{
  --bg:#e7e9f1; --panel:#ffffff; --panel-2:#f2f3f8; --line:#d5d8e4; --fg:#1b1d2a; --muted:#61657e;
  --accent:#3549d6; --accent-fg:#ffffff; --accent-soft:#e2e6fd; --pop:#b07c00; --danger:#c2410c;
  --stage:#d2d5e0; --check-a:#ffffff; --check-b:#e3e5ee; --grid:rgba(20,24,48,.10); --grid-major:rgba(20,24,48,.24); --ants:#1b1d2a; --frame-edge:rgba(20,24,48,.35);
  --f-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-pixel:"Silkscreen","JetBrains Mono",ui-monospace,monospace;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0f15; --panel:#181a24; --panel-2:#20232f; --line:#2d3144; --fg:#e7e8f2; --muted:#9397b0;
  --accent:#8a99ff; --accent-fg:#0e0f15; --accent-soft:#272c50; --pop:#f5c443; --danger:#f08a54;
  --stage:#0a0b10; --check-a:#2b2e3b; --check-b:#222530; --grid:rgba(255,255,255,.07); --grid-major:rgba(255,255,255,.17); --ants:#ffffff; --frame-edge:rgba(255,255,255,.25);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e0f15; --panel:#181a24; --panel-2:#20232f; --line:#2d3144; --fg:#e7e8f2; --muted:#9397b0;
  --accent:#8a99ff; --accent-fg:#0e0f15; --accent-soft:#272c50; --pop:#f5c443; --danger:#f08a54;
  --stage:#0a0b10; --check-a:#2b2e3b; --check-b:#222530; --grid:rgba(255,255,255,.07); --grid-major:rgba(255,255,255,.17); --ants:#ffffff; --frame-edge:rgba(255,255,255,.25);
  color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:13px;line-height:1.5;padding-inline:16px;padding-block:12px;box-sizing:border-box;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.checker{background-color:var(--check-a);background-image:conic-gradient(var(--check-b) 25%,transparent 0 50%,var(--check-b) 0 75%,transparent 0);background-size:8px 8px}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{font-family:var(--f-pixel);font-size:16px;letter-spacing:.06em;color:var(--accent);white-space:nowrap}
.name{width:150px;max-width:40vw;background:transparent;border:1px solid transparent;border-radius:5px;padding:3px 6px}
.name:hover,.name:focus{border-color:var(--line);background:var(--panel-2)}
.group{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:4px 10px;cursor:pointer;white-space:nowrap;min-height:28px}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:500}
.btn.danger{color:var(--danger)}
.btn.ic{width:28px;padding:0;font-size:15px}
.btn.ghost{background:transparent}
.btn.sm{min-height:24px;padding:2px 8px;font-size:12px}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.mono{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
#zoomLbl{min-width:46px;text-align:center}

.main{display:grid;grid-template-columns:48px minmax(0,1fr) 330px;gap:8px;min-height:0}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;overflow:auto}
.tool{width:36px;height:34px;display:grid;place-items:center;border-radius:5px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted)}
.tool:hover{color:var(--fg);background:var(--panel-2)}
.tool[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.sep{width:26px;height:1px;background:var(--line);margin:5px 0}
.colors{position:relative;width:38px;height:42px;flex:none}
.sw{position:absolute;border:2px solid var(--panel);outline:1px solid var(--line);border-radius:3px;cursor:pointer;padding:0}
.sw.pri{left:0;top:0;width:26px;height:26px;z-index:1}
.sw.sec{right:0;bottom:0;width:22px;height:22px}
.swap{font-size:11px;color:var(--muted);background:none;border:0;cursor:pointer;padding:0}

.stagecol{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:6px;min-width:0;min-height:0}
.toolopts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-height:38px}
.toolopts .tname{font-weight:700}
.toolopts .hint{color:var(--muted);font-size:12px}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper span{min-width:18px;text-align:center}
.vsep{width:1px;height:18px;background:var(--line)}
.stage{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:200px;touch-action:none}
#view{position:absolute;inset:0;display:block;cursor:crosshair}
.drop{position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--panel) 80%,transparent);font-weight:500;pointer-events:none}
.status{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:12px;padding:0 4px}
.status .mono{color:var(--fg)}

.timeline{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tl-ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tl-ctrl label{display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.tl-ctrl input[type=number]{width:64px}
.frames{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.fcell{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border:1px solid var(--line);border-radius:5px;background:var(--panel-2);cursor:pointer}
.fcell.on{border-color:var(--accent);background:var(--accent-soft)}
.fcell.play{outline:2px solid var(--pop)}
.fcell .fn{font-family:var(--f-pixel);font-size:10px;color:var(--muted)}
.fcell canvas{width:36px;height:36px}
canvas.thumb,.fcell canvas,.cand canvas,.convgrid canvas{image-rendering:pixelated;object-fit:contain}

.side{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:0;display:flex;flex-direction:column}
.gen{flex:1 1 52%}
.lower{flex:1 1 48%;overflow:auto}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:8px 4px 7px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabpanel{padding:10px 12px 14px;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:0;flex:1}
.tabpanel>*{flex:none}
.tabpanel h3{font-size:13px;margin:4px 0 0}
.tabpanel hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
.lbl{font-weight:500}
textarea,input[type=text],input:not([type]),input[type=number],select{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:5px 7px;min-width:0}
textarea{resize:vertical;width:100%}
.row2{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.row2>label{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.row2 input:not([type=checkbox]):not([type=radio]){flex:1}
.chk{color:var(--fg)!important}
.hint{color:var(--muted);font-size:12px;margin:0}
.note{background:var(--accent-soft);border-radius:6px;padding:8px 10px;margin:0;font-size:12px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.status-txt{color:var(--muted);font-size:12px}
.cands{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cands .empty{grid-column:1/-1;color:var(--muted);font-size:12px;margin:0;border:1px dashed var(--line);border-radius:6px;padding:10px}
.cand{border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:5px;min-width:0;background:var(--panel-2)}
.cand canvas{width:100%;aspect-ratio:1;max-width:100%;border-radius:3px}
.cand .cl{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cand .ca{display:flex;flex-wrap:wrap;gap:4px}
.cand.pending canvas{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.cand.pending canvas{animation:none}}
.palout{display:flex;flex-direction:column;gap:6px}
.swrow{display:flex;flex-wrap:wrap;gap:2px}
.swrow i{width:18px;height:18px;border-radius:3px;display:block}
.dropzone{border:1px dashed var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:12px}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.convgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.convgrid figure{margin:0;display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted);min-width:0}
.convgrid canvas{width:100%;aspect-ratio:1;max-width:100%;border-radius:4px;border:1px solid var(--line)}
.radio{display:flex;flex-direction:column;gap:4px}
.radio label{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.block{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.block+.block{border-top:1px solid var(--line)}
.bhead{display:flex;align-items:center;gap:6px}
.bhead h2{font-size:13px;margin:0;flex:1}
.bhead .count{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.mini{width:24px;height:24px;display:grid;place-items:center;border-radius:4px;border:0;background:transparent;cursor:pointer;color:var(--fg);padding:0;flex:none}
.mini:hover{background:var(--panel-2)}
.mini.off{color:var(--muted);opacity:.5}
.llist{display:flex;flex-direction:column;gap:2px;max-height:190px;overflow:auto}
.lrow{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:5px;border:1px solid transparent;cursor:pointer;min-width:0}
.lrow:hover{background:var(--panel-2)}
.lrow.on{background:var(--accent-soft);border-color:var(--accent)}
.lrow canvas.thumb{width:28px;height:28px;border-radius:3px;flex:none;border:1px solid var(--line)}
.lname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lname input{width:100%;padding:1px 4px}
.badge{font-family:var(--f-mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px;flex:none}
.lprops{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:12px}
.lprops label{display:inline-flex;align-items:center;gap:5px}
.lprops input[type=range]{width:90px}
.btnrow{display:flex;flex-wrap:wrap;gap:4px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(24px,1fr));gap:3px}
.pal button{aspect-ratio:1;border:1px solid var(--line);border-radius:3px;cursor:pointer;padding:0;position:relative;min-width:0}
.pal button.pri{outline:2px solid var(--fg);outline-offset:1px;z-index:1}
.pal button.sec::after{content:"";position:absolute;right:1px;bottom:1px;width:7px;height:7px;background:var(--panel);border:1px solid var(--fg);border-radius:1px}

.modal{position:fixed;inset:0;background:rgba(10,12,20,.45);display:grid;place-items:center;z-index:50;padding:16px}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(440px,100%);max-height:calc(100% - 20px);overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.dialog.wide{width:min(620px,100%)}
.dialog h2{margin:0;font-size:16px}
#mBody{display:flex;flex-direction:column;gap:10px}
#mActions{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.sizes{display:flex;flex-wrap:wrap;gap:4px}
.optlist{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block;font-weight:500}
.opt span{color:var(--muted);font-size:12px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
.keys kbd{font-family:var(--f-mono);font-size:11.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:0 5px;white-space:nowrap}
.fallback img{max-width:100%;image-rendering:pixelated;border:1px solid var(--line);border-radius:4px}
.fallback textarea{font-family:var(--f-mono);font-size:11px;height:140px}
.colorpick{display:flex;gap:10px;align-items:center}
.colorpick input[type=color]{width:56px;height:40px;padding:0;border:1px solid var(--line);border-radius:5px;background:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:12.5px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:980px){
  body{overflow:auto;height:auto}
  html{height:auto}
  #app{height:auto}
  .main{grid-template-columns:minmax(0,1fr)}
  .rail{flex-direction:row;flex-wrap:wrap;justify-content:center;overflow:visible}
  .sep{width:1px;height:26px;margin:0 4px}
  .stage{height:58vh}
  .gen,.lower{flex:none;overflow:visible}
  .tabpanel{overflow:visible}
  .llist{max-height:none}
}
</style>

<div id="app">
  <header class="top">
    <div class="brand"><span class="logo">DOTLAB</span><input id="docName" class="name" aria-label="작품 이름" spellcheck="false"></div>
    <div class="group">
      <button class="btn" id="bNew">새로 만들기</button>
      <button class="btn" id="bOpen" title="프로젝트(.json), 이미지, 팔레트 파일 열기">열기</button>
      <button class="btn" id="bSave" title="프로젝트 저장 (Ctrl+S)">저장</button>
      <button class="btn primary" id="bExport">내보내기</button>
    </div>
    <div class="group">
      <button class="btn ic" id="bUndo" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소">↶</button>
      <button class="btn ic" id="bRedo" title="다시 실행 (Ctrl+Shift+Z)" aria-label="다시 실행">↷</button>
    </div>
    <div class="group">
      <button class="btn ic" id="bZoomOut" title="축소 (-)" aria-label="축소">−</button>
      <span id="zoomLbl" class="mono">100%</span>
      <button class="btn ic" id="bZoomIn" title="확대 (+)" aria-label="확대">+</button>
      <button class="btn" id="bFit" title="화면에 맞춤 (0)">맞춤</button>
    </div>
    <div class="group">
      <button class="chip" id="tGrid" aria-pressed="true">그리드</button>
      <button class="chip" id="tTile" aria-pressed="false" title="3×3 반복 미리보기, 가장자리를 넘어 그리면 반대편에 이어짐">타일 모드</button>
      <button class="chip" id="tMirX" aria-pressed="false">좌우 대칭</button>
      <button class="chip" id="tMirY" aria-pressed="false">상하 대칭</button>
    </div>
    <span class="spacer"></span>
    <button class="btn ghost" id="bHelp">단축키</button>
  </header>

  <div class="main">
    <nav class="rail" id="rail" aria-label="도구">
      <div id="toolBtns" style="display:contents"></div>
      <div class="sep"></div>
      <div class="colors">
        <button class="sw pri" id="swPri" title="주 색상 (왼쪽 클릭)" aria-label="주 색상"></button>
        <button class="sw sec" id="swSec" title="보조 색상 (오른쪽 클릭)" aria-label="보조 색상"></button>
      </div>
      <button class="swap" id="swSwap" title="주/보조 색 바꾸기 (X)">⇄</button>
    </nav>

    <section class="stagecol">
      <div class="toolopts" id="toolOpts"></div>
      <div class="stage" id="stage"><canvas id="view"></canvas><div class="drop" id="dropHint" hidden>파일을 놓으면 열립니다</div></div>
      <div class="status"><span>좌표 <span class="mono" id="stPos">–</span></span><span id="stSize"></span><span id="stHint"></span></div>
      <div class="timeline">
        <div class="tl-ctrl">
          <button class="btn ic" id="bPlay" title="재생 / 정지 (Enter)" aria-label="재생"></button>
          <label>지속 <input type="number" id="frDur" min="20" max="5000" step="10"> ms</label>
          <button class="chip" id="tOnion" aria-pressed="false" title="이전 프레임(빨강)과 다음 프레임(파랑)을 겹쳐 보기">어니언 스킨</button>
          <span class="vsep"></span>
          <button class="btn sm" id="frAdd">빈 프레임</button>
          <button class="btn sm" id="frDup">복제</button>
          <button class="btn sm" id="frDel">삭제</button>
          <button class="btn sm" id="frL" title="앞으로 이동" aria-label="프레임 앞으로">←</button>
          <button class="btn sm" id="frR" title="뒤로 이동" aria-label="프레임 뒤로">→</button>
          <span class="hint" id="frInfo"></span>
        </div>
        <div class="frames" id="frameList"></div>
      </div>
    </section>

    <aside class="side">
      <div class="card gen">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" aria-selected="true" data-tab="pAI">AI 생성</button>
          <button class="tab" role="tab" aria-selected="false" data-tab="pConv">이미지 → 도트</button>
          <button class="tab" role="tab" aria-selected="false" data-tab="pRef">참조 이미지</button>
        </div>

        <div class="tabpanel" id="pAI" role="tabpanel">
          <p class="note" id="aiNote">AI 기능을 준비하는 중입니다…</p>
          <label class="lbl" for="aiPrompt">무엇을 그릴까요?</label>
          <textarea id="aiPrompt" rows="3" placeholder="예: 빨간 망토를 두른 작은 기사"></textarea>
          <div class="row2">
            <label>스타일 <select id="aiStyle">
              <option value="char">캐릭터 (정면)</option>
              <option value="side">캐릭터 (측면)</option>
              <option value="item">아이템 아이콘</option>
              <option value="monster">몬스터</option>
              <option value="tile">배경 타일 (이음새 없음)</option>
              <option value="icon">이모지 · 아이콘</option>
              <option value="free">자유</option>
            </select></label>
            <label>크기 <select id="aiSize"></select></label>
          </div>
          <div class="row2">
            <label class="chk"><input type="checkbox" id="aiOutline" checked> 어두운 외곽선</label>
            <label class="chk"><input type="checkbox" id="aiBg" checked> 투명 배경</label>
            <label>품질 <select id="aiTier"><option value="quick">빠름</option><option value="default" selected>기본</option><option value="complex">정밀 (느림)</option></select></label>
          </div>
          <p class="hint" id="aiPalHint"></p>
          <div class="actions"><button class="btn primary" id="aiGo">생성</button><button class="btn" id="aiStop" hidden>중지</button><span class="status-txt" id="aiStatus"></span></div>
          <div class="cands" id="cands"></div>
          <hr>
          <h3>선택 영역 다시 그리기</h3>
          <p class="hint" id="editHint"></p>
          <textarea id="aiEdit" rows="2" placeholder="예: 칼을 도끼로 바꿔줘"></textarea>
          <div class="actions"><button class="btn" id="aiEditGo">수정 요청</button></div>
          <hr>
          <h3>문장으로 팔레트 만들기</h3>
          <div class="row2"><input id="palQ" placeholder="예: 해질녘 사막, 오래된 게임기 느낌" aria-label="팔레트 주제"><select id="palN" aria-label="색 수"><option>4</option><option selected>8</option><option>16</option><option>32</option></select></div>
          <div class="actions"><button class="btn" id="palGo">팔레트 생성</button></div>
          <div class="palout" id="palOut"></div>
        </div>

        <div class="tabpanel" id="pConv" role="tabpanel" hidden>
          <div class="dropzone" id="convDrop">
            <span>도트 이미지(확대본, JPG 저장본 포함)나 사진을 고르거나 끌어 놓으세요. 이 화면에 붙여넣어도 됩니다. 처리는 이 브라우저 안에서만 합니다.</span>
            <input type="file" id="convFile" accept="image/*" aria-label="변환할 이미지">
          </div>
          <div class="convgrid">
            <figure><canvas id="convSrc" width="1" height="1" class="checker"></canvas><figcaption>원본 · 감지한 격자</figcaption></figure>
            <figure><canvas id="convOut" width="1" height="1" class="checker"></canvas><figcaption id="convCap">결과</figcaption></figure>
          </div>
          <div class="radio" role="radiogroup" aria-label="결과 크기">
            <label><input type="radio" name="convSize" value="auto" checked> 원본 픽셀 크기 자동 감지</label>
            <label><input type="radio" name="convSize" value="canvas"> 현재 캔버스 크기에 맞추기</label>
          </div>
          <div id="convAutoBox" class="radio">
            <p class="hint" id="convDetect"></p>
            <div class="row2"><label>도트 1칸 = <input type="number" id="convPx" min="1" max="512" step="0.01" style="width:76px;flex:none"> px</label><span class="hint mono" id="convOutSize"></span><button class="btn sm" id="convRedetect" disabled>다시 감지</button></div>
          </div>
          <div class="row2" id="convFitRow" hidden><label>맞춤 <select id="convFit"><option value="contain">전체 보이기</option><option value="cover">꽉 채우기</option></select></label></div>
          <div class="row2"><label>채도 보정 <input type="range" id="convSat" min="0" max="60" value="0"></label></div>
          <div class="radio" role="radiogroup" aria-label="색 처리">
            <label><input type="radio" name="convMode" value="exact" checked> 이미지 색 그대로 (거의 같은 색은 하나로)</label>
            <label><input type="radio" name="convMode" value="new"> 색 수를 <select id="convN" aria-label="색 수"><option>4</option><option selected>8</option><option>12</option><option>16</option><option>24</option><option>32</option></select>개로 줄이기</label>
            <label><input type="radio" name="convMode" value="pal"> 현재 팔레트 색에 맞추기</label>
          </div>
          <div class="row2">
            <label class="chk"><input type="checkbox" id="convBg"> 배경 제거</label>
            <label class="chk"><input type="checkbox" id="convClean"> 튀는 픽셀 정리</label>
          </div>
          <div class="actions"><button class="btn primary" id="convOpen" disabled>새 캔버스로 열어 수정</button><button class="btn" id="convGo" disabled>현재 캔버스에 레이어로 넣기</button><button class="btn" id="convRef" disabled>참조 이미지로 쓰기</button></div>
        </div>

        <div class="tabpanel" id="pRef" role="tabpanel" hidden>
          <p class="hint">따라 그릴 사진이나 그림을 캔버스에 겹쳐 띄웁니다. 참조 이미지는 저장과 내보내기에 포함되지 않습니다.</p>
          <input type="file" id="refFile" accept="image/*" aria-label="참조 이미지 파일">
          <div class="row2"><label>불투명도 <input type="range" id="refOp" min="5" max="100" value="40"></label></div>
          <div class="row2">
            <label class="chk"><input type="checkbox" id="refVis" checked> 보이기</label>
            <label class="chk"><input type="checkbox" id="refAbove"> 그림 위에 표시</label>
          </div>
          <div class="actions"><button class="btn" id="refDel" disabled>참조 이미지 제거</button></div>
        </div>
      </div>

      <div class="card lower">
        <section class="block">
          <div class="bhead"><h2>레이어</h2>
            <button class="mini" id="lAdd" title="새 레이어" aria-label="새 레이어"></button>
            <button class="mini" id="lDup" title="레이어 복제" aria-label="레이어 복제"></button>
            <button class="mini" id="lUp" title="위로" aria-label="레이어 위로"></button>
            <button class="mini" id="lDown" title="아래로" aria-label="레이어 아래로"></button>
            <button class="mini" id="lMerge" title="아래 레이어와 합치기" aria-label="아래 레이어와 합치기"></button>
            <button class="mini" id="lDel" title="레이어 삭제" aria-label="레이어 삭제"></button>
          </div>
          <div class="llist" id="layerList"></div>
          <div class="lprops" id="layerProps"></div>
        </section>
        <section class="block">
          <div class="bhead"><h2>팔레트</h2><span class="count" id="palCount"></span></div>
          <div class="pal" id="palGrid"></div>
          <p class="hint">클릭: 주 색상 · 오른쪽 클릭: 보조 색상 · 더블클릭: 색 편집</p>
          <div class="btnrow">
            <button class="btn sm" id="pAdd">색 추가</button>
            <button class="btn sm" id="pEdit">편집</button>
            <button class="btn sm" id="pDel">삭제</button>
            <button class="btn sm" id="pRamp" title="주 색상에서 보조 색상까지 중간색 만들기">램프</button>
            <button class="btn sm" id="pPreset">프리셋</button>
            <button class="btn sm" id="pImport">가져오기</button>
            <button class="btn sm" id="pExport">내보내기</button>
          </div>
        </section>
      </div>
    </aside>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mTitle"><h2 id="mTitle"></h2><div id="mBody"></div><div id="mActions"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<input type="file" id="palFile" class="vh" accept=".hex,.gpl,.txt" tabindex="-1" aria-hidden="true">
